  <style>
    :root{--line:#06c755;--ink:#172033;--muted:#718096;--border:#dbe3ee;--soft:#f6f8fb;--red:#d92d20}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:"Noto Sans TC",Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}.title h1{font-size:24px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.actions input{height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px}.openLink,.secondaryButton,.importButton,.dangerButton{height:40px;border-radius:10px;padding:0 14px;font-weight:850}.openLink{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #b6ecc8;background:#effcf4;color:#067a35}.secondaryButton{border:1px solid var(--border);background:#fff;color:#344054}.importButton{border:0;background:var(--line);color:#fff}.dangerButton{border:1px solid #fecdd3;background:#fff1f3;color:#b42318}.dangerButton:disabled{opacity:.45}.shell{padding:20px 24px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 28px rgba(16,24,40,.04)}.templateDesigner{padding:0;overflow:hidden}.templateDesignerGrid{display:grid;grid-template-columns:minmax(520px,650px) minmax(420px,1fr);align-items:start;min-height:calc(100vh - 118px)}.templateControls{padding:18px;border-right:1px solid #edf1f5;background:#fbfdff;display:grid;gap:14px;align-content:start}.templatePreviewPane{position:sticky;top:82px;height:calc(100vh - 102px);padding:18px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.templateBlock{border:1px solid #edf1f5;border-radius:16px;background:#fff;padding:14px;min-width:0;overflow:hidden}.templateBlockHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.templateBlockHead strong{font-size:16px}.templateTriggerCompact{display:grid;grid-template-columns:minmax(230px,1fr) minmax(190px,.8fr) auto;gap:10px;align-items:end}.templateSwitch{display:flex!important;align-items:center!important;gap:8px;white-space:nowrap}.templateSwitch input{width:16px!important;height:16px!important;min-width:16px!important}.templateDesigner label{display:grid;gap:7px;color:#344054;font-size:14px;font-weight:850;min-width:0}.templateDesigner input,.templateDesigner select,.templateDesigner textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:#fff}.templateDesigner textarea{min-height:48px;resize:vertical}.templatePages{display:grid;gap:16px}.templatePage{border:1px solid #dbe6f4;border-radius:14px;background:#fff;padding:16px}.templatePageHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #edf1f5}.templateImageUpload{border:1px dashed #a9bfd9;border-radius:12px;background:#f8fafc;padding:12px;display:grid;gap:8px}.templateUploadRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.templateImageStatus{font-size:12px;color:#667085;line-height:1.4}.templateGrid{display:grid;gap:10px}.templateImageOptions{grid-template-columns:minmax(0,1fr) 110px 120px 110px!important;margin-top:10px}.templateButtons{display:grid;gap:8px;margin-top:10px}.templateButton{border:1px dashed #bfd0e6;border-radius:12px;background:#fff;padding:10px}.templateButtonGrid{display:grid;grid-template-columns:minmax(140px,1fr) 120px minmax(140px,1fr) minmax(150px,1fr) 140px auto;gap:8px;align-items:end}.templateColorRow{display:grid;grid-template-columns:48px minmax(0,160px);gap:6px}.templateColorRow input[type=color]{height:42px;padding:2px}.templateVisualPreview{display:flex;gap:16px;overflow:auto;padding:14px;border:1px solid #edf1f5;border-radius:18px;background:#f6f8fb;min-height:0;flex:1 1 auto}.templatePhone{width:280px;flex:0 0 280px;border:1px solid #d8dee8;border-radius:20px;background:#fff;box-shadow:0 16px 34px rgba(16,24,40,.10);overflow:hidden}.templatePhoneImage{height:420px;background:#e8eef5;display:grid;place-items:center;color:#667085;text-align:center}.templatePhoneImage img{width:100%;height:100%;object-fit:cover;display:block}.templatePhoneFooter{display:grid;gap:8px;padding:10px;background:#fff}.templatePhoneButton{height:40px;border:0;border-radius:8px;background:#06c755;color:#fff;font-weight:850;display:grid;place-items:center;text-align:center;padding:0 10px}.templateJsonFold{margin-top:14px;border:1px solid #edf1f5;border-radius:14px;background:#fff;overflow:hidden;flex:0 0 auto}.templateJsonFold summary{cursor:pointer;padding:12px 14px;font-weight:900}.templatePreview{margin:0;white-space:pre-wrap;background:#101828;color:#e5e7eb;padding:12px;max-height:300px;overflow:auto;font-size:12px}.templateInlineStatus{font-size:13px;font-weight:850;color:#667085;white-space:nowrap}.templateInlineStatus.ok{color:#067a35}.templateInlineStatus.bad{color:#b42318}.importResult{border-radius:12px;background:#f8fafc;padding:12px;color:#344054;line-height:1.55}.importResult.ok{background:#effcf4;color:#067a35}.importResult.bad{background:#fff1f3;color:#b42318}.hide{display:none}@media(max-width:1180px){.top{position:static}.templateDesignerGrid{grid-template-columns:1fr}.templateControls{border-right:0;border-bottom:1px solid #edf1f5}.templatePreviewPane{position:static;height:auto}.templateButtonGrid,.templateImageOptions,.templateTriggerCompact{grid-template-columns:1fr!important}.templatePhone{width:240px;flex-basis:240px}.templatePhoneImage{height:360px}}

</head>
<body>
  <header class="top">
    <div class="title"><h1>HookTea 簽到贈點活動模板</h1><p class="muted">所見即所得 LINE Flex 多頁活動卡</p></div>
    <div class="actions"><input id="adminPassword" type="password" placeholder="管理密碼"><button id="syncButton" class="secondaryButton" type="button">同步</button><button id="templateSaveTop" class="importButton" type="button">儲存模板</button><a class="openLink" href="/admin.html">返回後台</a></div>
  </header>
  <main class="shell">
    <section class="section" id="checkinTemplatePanel">
      <div class="sectionHead"><h3>簽到贈點活動模板</h3><div class="actions"><span id="templateInlineStatus" class="templateInlineStatus" aria-live="polite"></span><button id="templateAddPage" class="secondaryButton" type="button">新增頁面</button><button id="templateSave" class="importButton" type="button">儲存模板</button></div></div>
      <article class="card templateDesigner">
        <div class="templateDesignerGrid">
          <div class="templateControls">
            <div class="templateBlock templateTriggerBlock"><div class="templateBlockHead"><strong>觸發設定</strong><span class="muted">輸入關鍵字自動回覆</span></div><div class="templateTriggerCompact"><label>觸發關鍵字<textarea id="templateKeywords" placeholder="每行一個，例如：簽到贈點活動"></textarea></label><label>替代文字<input id="templateAltText" type="text" placeholder="簽到贈點活動"></label><label>發送輪動<select id="templateRotationMode"><option value="random">隨機輪動</option><option value="sequential">順序輪動</option></select></label><label class="templateSwitch"><input id="templateActive" type="checkbox" checked> 啟用關鍵字觸發</label></div></div>
            <div class="templateBlock"><div class="templateBlockHead"><strong>頁面設定</strong><span class="muted">400 x 600（LINE 2:3）</span></div><div id="templatePages" class="templatePages"></div></div>
            <div id="templateStatus" class="importResult hide"></div>
          </div>
          <aside class="templatePreviewPane"><div class="templateBlockHead"><strong>即時預覽</strong><span class="muted">400 x 600，多頁左右排列</span></div><div id="templateVisualPreview" class="templateVisualPreview"></div><details class="templateJsonFold"><summary>JSON 預覽</summary><pre id="templatePreview" class="templatePreview"></pre></details></aside>
        </div>
      </article>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const TEMPLATE_BUBBLE_SIZES = ["nano","micro","deca","hecto","kilo","mega","giga"];
    const TEMPLATE_ASPECT_MODES = ["cover","fit"];
    let checkinTemplateDraft = null;
    function currentAdminPassword(){ return $("adminPassword").value.trim() || sessionStorage.getItem("act_admin_pwd") || ""; }
    function currentAdminSession(){ return sessionStorage.getItem("hooktea_admin_session") || new URLSearchParams(location.search).get("adminSession") || ""; }
    function hasAdminAuth(){ return !!(currentAdminSession() || currentAdminPassword()); }
    function authHeaders(extra={}){ const s=currentAdminSession(); const p=currentAdminPassword(); return Object.assign(s ? {"x-hooktea-admin-session":s} : (p ? {"x-hooktea-admin-password":p} : {}), extra); }
    function defaultTemplateButton(type="message"){ return { label:type==="uri"?"開啟連結":"簽到贈點", type, text:type==="uri"?"":"會員打卡", uri:"", color:"" }; }
    function defaultTemplatePage(){ return { imageUrl:"", imageLink:"", bubbleSize:"nano", imageAspectRatio:"400:600", imageAspectMode:"cover", buttons:[defaultTemplateButton()] }; }
    function defaultCheckinTemplate(){ return { active:true, keywords:["簽到贈點活動"], altText:"簽到贈點活動", rotationMode:"random", pages:[defaultTemplatePage()] }; }
    function normalizeTemplateBubbleSize(v){ const s=String(v||"nano").trim().toLowerCase(); return TEMPLATE_BUBBLE_SIZES.includes(s)?s:"nano"; }
    function normalizeTemplateAspectRatio(v){ const r=String(v||"400:600").trim().replace(/[：]/g,":"); return /^\d{1,4}:\d{1,4}$/.test(r)?r:"400:600"; }
    function normalizeTemplateAspectMode(v){ const m=String(v||"cover").trim().toLowerCase(); return TEMPLATE_ASPECT_MODES.includes(m)?m:"cover"; }
    function normalizeTemplateRotationMode(v){ return String(v||"random").trim().toLowerCase()==="sequential"?"sequential":"random"; }
    function renderTemplateOptions(options,current,normalizer){ const selected=normalizer(current); return options.map(item=>`<option value="${item}" ${item===selected?"selected":""}>${item}</option>`).join(""); }
    function esc(v){ return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function normalizeTemplateForEditor(template){ const base=defaultCheckinTemplate(); const pages=Array.isArray(template.pages)&&template.pages.length?template.pages:base.pages; return { active:template.active!==false, keywords:Array.isArray(template.keywords)&&template.keywords.length?template.keywords.map(x=>String(x||"").trim()).filter(Boolean):base.keywords, altText:String(template.altText||base.altText), rotationMode:normalizeTemplateRotationMode(template.rotationMode||base.rotationMode), pages:pages.slice(0,12).map(page=>({ imageUrl:String(page.imageUrl||page.image_url||""), imageLink:String(page.imageLink||page.image_link||""), bubbleSize:normalizeTemplateBubbleSize(page.bubbleSize||page.bubble_size||page.size), imageAspectRatio:normalizeTemplateAspectRatio(page.imageAspectRatio||page.image_aspect_ratio||page.aspectRatio), imageAspectMode:normalizeTemplateAspectMode(page.imageAspectMode||page.image_aspect_mode||page.aspectMode), buttons:(Array.isArray(page.buttons)&&page.buttons.length?page.buttons:[defaultTemplateButton()]).slice(0,4).map(button=>({label:String(button.label||"按鈕"), type:button.type==="uri"?"uri":"message", text:String(button.text||""), uri:String(button.uri||""), color:String(button.color||"")})) })) }; }
    function renderCheckinTemplateEditor(template){ const normalized=normalizeTemplateForEditor(template||defaultCheckinTemplate()); checkinTemplateDraft=normalized; $("templateActive").checked=normalized.active!==false; $("templateKeywords").value=normalized.keywords.join("\n"); $("templateAltText").value=normalized.altText||"簽到贈點活動"; $("templateRotationMode").value=normalized.rotationMode||"random"; $("templatePages").innerHTML=normalized.pages.map(renderTemplatePage).join(""); refreshTemplatePreview(); }
    function renderTemplatePage(page,pageIndex){ const buttons=Array.isArray(page.buttons)&&page.buttons.length?page.buttons:[defaultTemplateButton()]; return `<div class="templatePage" data-page-index="${pageIndex}"><div class="templatePageHead"><strong>第 ${pageIndex+1} 頁 <span class="muted">400 x 600（LINE 2:3）</span></strong><button type="button" class="dangerButton" data-template-action="remove-page" ${pageIndex===0?"disabled":""}>刪除頁面</button></div><div class="templateImageUpload"><div class="templateUploadRow"><label>上傳圖片<input data-field="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><a class="openLink" href="${esc(page.imageUrl||'#')}" target="_blank" rel="noopener">查看圖片</a></div><input data-field="imageUrl" type="url" value="${esc(page.imageUrl)}" placeholder="上傳後自動產生圖片 URL，也可貼 HTTPS 圖片網址"><div class="templateImageStatus">圖片依下方比例裁切預覽；建議尺寸 400 x 600，檔案 1MB 內。</div></div><div class="templateGrid templateImageOptions"><label>點圖連結<input data-field="imageLink" type="url" value="${esc(page.imageLink)}" placeholder="點圖片後開啟的網址，可空白"></label><label>卡片 Size<select data-field="bubbleSize">${renderTemplateOptions(TEMPLATE_BUBBLE_SIZES,page.bubbleSize,normalizeTemplateBubbleSize)}</select></label><label>圖片比例<input data-field="imageAspectRatio" type="text" value="${esc(normalizeTemplateAspectRatio(page.imageAspectRatio))}" placeholder="400:600"></label><label>圖片模式<select data-field="imageAspectMode">${renderTemplateOptions(TEMPLATE_ASPECT_MODES,page.imageAspectMode,normalizeTemplateAspectMode)}</select></label></div><div class="templateButtons">${buttons.map(renderTemplateButton).join("")}</div><div class="actions" style="margin-top:10px"><button type="button" class="secondaryButton" data-template-action="add-button">新增 button</button></div></div>`; }
    function renderTemplateButton(button,buttonIndex){ const type=button.type==="uri"?"uri":"message"; const color=/^#[0-9a-f]{6}$/i.test(button.color||"")?button.color:"#06C755"; return `<div class="templateButton" data-button-index="${buttonIndex}"><div class="templateButtonGrid"><label>按鈕文字<input data-field="label" type="text" value="${esc(button.label)}" placeholder="簽到贈點"></label><label>動作<select data-field="type"><option value="message" ${type==="message"?"selected":""}>送出文字</option><option value="uri" ${type==="uri"?"selected":""}>開啟連結</option></select></label><label>送出文字<input data-field="text" type="text" value="${esc(button.text)}" placeholder="會員打卡"></label><label>連結 URL<input data-field="uri" type="url" value="${esc(button.uri)}" placeholder="https://..."></label><label>顏色<div class="templateColorRow"><input data-field="colorPicker" type="color" value="${esc(color)}"><input data-field="color" type="text" value="${esc(button.color)}" placeholder="#06C755"></div></label><button type="button" class="dangerButton" data-template-action="remove-button" ${buttonIndex===0?"disabled":""}>刪除</button></div></div>`; }
    function collectCheckinTemplate(){ const pages=Array.from(document.querySelectorAll("#templatePages .templatePage")).map(pageEl=>{ const valueOf=field=>pageEl.querySelector(`[data-field="${field}"]`)?.value.trim()||""; const buttons=Array.from(pageEl.querySelectorAll(".templateButton")).map(buttonEl=>{ const get=field=>buttonEl.querySelector(`[data-field="${field}"]`)?.value.trim()||""; return {label:get("label")||"按鈕",type:get("type")==="uri"?"uri":"message",text:get("text"),uri:get("uri"),color:get("color")}; }).filter(button=>button.label&&(button.type==="uri"?button.uri:button.text)); return {imageUrl:valueOf("imageUrl"),imageLink:valueOf("imageLink"),bubbleSize:normalizeTemplateBubbleSize(valueOf("bubbleSize")),imageAspectRatio:normalizeTemplateAspectRatio(valueOf("imageAspectRatio")),imageAspectMode:normalizeTemplateAspectMode(valueOf("imageAspectMode")),buttons}; }); return { active:$("templateActive").checked, keywords:$("templateKeywords").value.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean), altText:$("templateAltText").value.trim()||"簽到贈點活動", rotationMode:normalizeTemplateRotationMode($("templateRotationMode").value), pages }; }
    function refreshTemplatePreview(){ const template=collectCheckinTemplate(); const normalized=template.pages.length?template:normalizeTemplateForEditor(checkinTemplateDraft||defaultCheckinTemplate()); $("templatePreview").textContent=JSON.stringify(buildTemplateFlexPreview(normalized).contents,null,2); renderTemplateVisualPreview(normalized); }
    function renderTemplateVisualPreview(template){ const pages=Array.isArray(template.pages)&&template.pages.length?template.pages:defaultCheckinTemplate().pages; $("templateVisualPreview").innerHTML=pages.slice(0,12).map((page,index)=>{ const image=page.imageUrl?`<img src="${esc(page.imageUrl)}" alt="第 ${index+1} 頁圖片">`:`<span>上傳第 ${index+1} 頁圖片</span>`; const buttons=(page.buttons||[]).slice(0,4).filter(b=>b.label).map(b=>`<div class="templatePhoneButton" style="background:${esc(/^#[0-9a-f]{6}$/i.test(b.color||"")?b.color:"#06C755")}">${esc(b.label||"按鈕")}</div>`).join(""); return `<div class="templatePhone"><div class="templatePhoneImage">${image}</div><div class="templatePhoneFooter">${buttons||'<div class="muted">尚未設定按鈕</div>'}</div></div>`; }).join(""); }
    function buildTemplateFlexPreview(template){ const pages=Array.isArray(template.pages)&&template.pages.length?template.pages:defaultCheckinTemplate().pages; return { type:"flex", altText:template.altText||"簽到贈點活動", contents:{ type:"carousel", contents:pages.slice(0,12).map(page=>{ const bubble={ type:"bubble", size:normalizeTemplateBubbleSize(page.bubbleSize), body:{ type:"box", layout:"vertical", contents:[{type:"image",url:page.imageUrl,size:"full",aspectMode:normalizeTemplateAspectMode(page.imageAspectMode),aspectRatio:normalizeTemplateAspectRatio(page.imageAspectRatio),gravity:"top",...(page.imageLink?{action:{type:"uri",uri:page.imageLink}}:{})}], paddingAll:"0px" } }; const buttons=(page.buttons||[]).slice(0,4).filter(b=>b.label&&(b.type==="uri"?b.uri:b.text)); if(buttons.length) bubble.footer={type:"box",layout:"vertical",contents:buttons.map(b=>({type:"button",action:b.type==="uri"?{type:"uri",label:b.label,uri:b.uri}:{type:"message",label:b.label,text:b.text},height:"sm",style:"primary",...(b.color?{color:b.color}:{})}))}; return bubble; }) } }; }

    const TEMPLATE_IMAGE_MAX_BYTES = 1024 * 1024;
    function formatTemplateBytes(size){ const n=Number(size)||0; if(n>=1024*1024) return (n/1024/1024).toFixed(n>=10*1024*1024?0:1)+" MB"; return Math.max(1,Math.round(n/1024))+" KB"; }
    function canvasToTemplateBlob(canvas,type,quality){ return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("圖片壓縮失敗，請換一張圖片。")),type,quality)); }
    async function loadTemplateImage(file){
      if(window.createImageBitmap){
        try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(_err){}
      }
      return await new Promise((resolve,reject)=>{
        const url=URL.createObjectURL(file);
        const img=new Image();
        img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
        img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("圖片讀取失敗，請改用 JPG、PNG 或 WebP。")); };
        img.src=url;
      });
    }
    async function compressTemplateImage(file){
      const mime = String(file.type||"").toLowerCase(); const allowedSmall = ["image/jpeg","image/jpg","image/png","image/webp","image/gif"].includes(mime);
      if(file.size <= TEMPLATE_IMAGE_MAX_BYTES && allowedSmall) return { file, compressed:false, originalSize:file.size };
      if(!String(file.type||"").toLowerCase().startsWith("image/")) throw new Error("請上傳圖片檔案。");
      const image = await loadTemplateImage(file);
      const sourceWidth = image.width || image.naturalWidth;
      const sourceHeight = image.height || image.naturalHeight;
      if(!sourceWidth || !sourceHeight) throw new Error("圖片尺寸讀取失敗，請換一張圖片。");
      const maxEdges = [1600,1400,1200,1000,800,640,520];
      const qualities = [0.86,0.78,0.68,0.58,0.48,0.38,0.30];
      let best = null;
      for(const maxEdge of maxEdges){
        const scale = Math.min(1, maxEdge / Math.max(sourceWidth, sourceHeight));
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d", { alpha:true });
        ctx.drawImage(image, 0, 0, width, height);
        for(const quality of qualities){
          const blob = await canvasToTemplateBlob(canvas,"image/webp",quality);
          if(!best || blob.size < best.size) best = blob;
          if(blob.size <= TEMPLATE_IMAGE_MAX_BYTES){
            const rawName = file.name || "template-image"; const parts = rawName.split("."); const baseName = (parts.length > 1 ? parts.slice(0,-1).join(".") : rawName) || "template-image";
            return { file:new File([blob], baseName + ".webp", { type:"image/webp" }), compressed:true, originalSize:file.size };
          }
        }
      }
      throw new Error("圖片自動壓縮後仍超過 1MB（目前約 " + formatTemplateBytes((best&&best.size)||file.size) + "），請改用較小圖片。");
    }

    function setTemplateStatus(text,ok){ const target=$("templateStatus"), inline=$("templateInlineStatus"); [target,inline].forEach(el=>{ if(!el)return; el.textContent=text||""; el.classList.toggle("hide",!text); el.classList.toggle("ok",!!(text&&ok)); el.classList.toggle("bad",!!(text&&!ok)); }); }
    async function loadCheckinTemplate(){ try{ const p=currentAdminPassword(); if(!hasAdminAuth()){ setTemplateStatus("後台授權未帶入，請從後台側欄重新開啟，或輸入管理密碼後按同步。",false); return; } if(p&&!$("adminPassword").value.trim()) $("adminPassword").value=p; setTemplateStatus("同步中...",true); const res=await fetch("/api/checkin-template",{headers:authHeaders()}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success") throw new Error(json.message||json.error||"簽到模板載入失敗"); renderCheckinTemplateEditor(json.data||defaultCheckinTemplate()); setTemplateStatus("模板已同步",true); }catch(err){ setTemplateStatus(err.message||String(err),false); } }
    async function saveCheckinTemplate(){ const template=collectCheckinTemplate(); if(!hasAdminAuth()) return setTemplateStatus("後台授權未帶入，請從後台側欄重新開啟，或輸入管理密碼。",false); if(!template.keywords.length) return setTemplateStatus("請至少輸入一個觸發關鍵字。",false); if(!template.pages.length||template.pages.some(p=>!p.imageUrl)) return setTemplateStatus("請先為每一頁上傳圖片或貼上 HTTPS 圖片網址。",false); try{ setTemplateStatus("儲存中...",true); const res=await fetch("/api/checkin-template",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(template)}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success") throw new Error(json.message||json.error||"簽到模板儲存失敗"); renderCheckinTemplateEditor(json.data||template); setTemplateStatus("已儲存，LINE 關鍵字已更新。",true); }catch(err){ setTemplateStatus(err.message||String(err),false); } }
    async function uploadTemplateImage(input){ const pageEl=input.closest(".templatePage"); const urlInput=pageEl?.querySelector('[data-field="imageUrl"]'); const status=pageEl?.querySelector(".templateImageStatus"); const file=input.files&&input.files[0]; if(!file||!urlInput)return; if(!hasAdminAuth()){ const msg="後台授權未帶入，請從後台側欄重新開啟，或輸入管理密碼。"; if(status) status.textContent=msg; setTemplateStatus(msg,false); return; } let previewUrl=""; try{ status.textContent=file.size>TEMPLATE_IMAGE_MAX_BYTES?"圖片壓縮中...":"圖片上傳中..."; previewUrl=URL.createObjectURL(file); urlInput.value=previewUrl; refreshTemplatePreview(); const prepared=await compressTemplateImage(file); const uploadFile=prepared.file; if(prepared.compressed){ if(previewUrl) URL.revokeObjectURL(previewUrl); previewUrl=URL.createObjectURL(uploadFile); urlInput.value=previewUrl; status.textContent="已自動壓縮 " + formatTemplateBytes(prepared.originalSize) + " → " + formatTemplateBytes(uploadFile.size) + "，上傳中..."; refreshTemplatePreview(); } const form=new FormData(); form.append("image",uploadFile,uploadFile.name||"template-image.webp"); const res=await fetch("/api/checkin-template/upload-image",{method:"POST",headers:authHeaders(),body:form}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success"||!json.data?.url) throw new Error(json.message||json.error||"圖片上傳失敗"); urlInput.value=json.data.url; status.textContent=(prepared.compressed?"已自動壓縮並":"") + "已上傳：" + formatTemplateBytes(json.data.size||uploadFile.size||0); refreshTemplatePreview(); }catch(err){ status.textContent=err.message||String(err); setTemplateStatus(err.message||String(err),false); } finally { if(previewUrl) URL.revokeObjectURL(previewUrl); } }
    document.addEventListener("input",e=>{ if(e.target.matches('[data-field="colorPicker"]')){ const text=e.target.closest(".templateColorRow")?.querySelector('[data-field="color"]'); if(text) text.value=e.target.value.toUpperCase(); } if(!e.target.matches('[data-field="imageFile"]')) refreshTemplatePreview(); });
    document.addEventListener("change",e=>{ if(e.target.matches('[data-field="imageFile"]')) uploadTemplateImage(e.target); else refreshTemplatePreview(); });
    document.addEventListener("click",e=>{ const button=e.target.closest("[data-template-action]"); if(!button)return; const action=button.dataset.templateAction; const pageEl=button.closest(".templatePage"); const pageIndex=pageEl?Number(pageEl.dataset.pageIndex):-1; const template=collectCheckinTemplate(); if(action==="add-button"&&pageIndex>=0){ template.pages[pageIndex].buttons.push(defaultTemplateButton()); } else if(action==="remove-page"&&pageIndex>0){ template.pages.splice(pageIndex,1); } else if(action==="remove-button"&&pageIndex>=0){ const buttonEl=button.closest(".templateButton"); const buttonIndex=buttonEl?Number(buttonEl.dataset.buttonIndex):-1; if(buttonIndex>0) template.pages[pageIndex].buttons.splice(buttonIndex,1); } renderCheckinTemplateEditor(template); });
    $("templateAddPage").onclick=()=>{ const template=collectCheckinTemplate(); template.pages.push(defaultTemplatePage()); renderCheckinTemplateEditor(template); };
    $("templateSave").onclick=saveCheckinTemplate; $("templateSaveTop").onclick=saveCheckinTemplate; $("syncButton").onclick=loadCheckinTemplate;
    renderCheckinTemplateEditor(defaultCheckinTemplate()); const savedAdminPassword=currentAdminPassword(); if(savedAdminPassword) $("adminPassword").value=savedAdminPassword; loadCheckinTemplate();
  </script>
</body>
</html>
