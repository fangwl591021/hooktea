name: Scoped webhook signin hotfix v3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/webhook-signin-idempotency-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webhook-signin-idempotency-20260820
          fetch-depth: 0
      - name: Apply scoped patch
        run: python .github/hotfix_webhook_signin_patch.py
      - name: Syntax check
        run: node --check worker.js
      - name: Commit scoped changes and cleanup
        shell: bash
        run: |
          git config user.name "hooktea-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "fix: make webhook signin idempotent"
          git rm .github/hotfix_webhook_signin_patch.py .github/workflows/hotfix-webhook-signin.yml
          git commit -m "chore: remove temporary hotfix runner"
          git push origin HEAD:fix/webhook-signin-idempotency-20260820
