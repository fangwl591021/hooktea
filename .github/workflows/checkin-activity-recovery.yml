name: Checkin activity recovery

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'fix/checkin-reward-activity-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkin-reward-activity-20260821
          fetch-depth: 0

      - name: Restore known-good worker and fix activity template storage
        shell: bash
        run: |
          git show 8bc00cab81ec0b0b6ccc81ad42e33c4ddd8df18d:worker.js > worker.js
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text(encoding='utf-8')

          old_save = '  await safePutKV(env, HOOKTEA_CHECKIN_TEMPLATE_KEY, data, { preferWasabi: false });'
          new_save = '  await safePutKV(env, HOOKTEA_CHECKIN_TEMPLATE_KEY, data);'
          if s.count(old_save) != 1:
              raise SystemExit(f'checkin template save target count={s.count(old_save)}')
          s = s.replace(old_save, new_save, 1)

          old_rotation = '  await safePutKV(env, HOOKTEA_CHECKIN_TEMPLATE_ROTATION_KEY, { offset: (offset + 1) % list.length, pageCount: list.length, updatedAt: new Date().toISOString() }, { preferWasabi: false }).catch(() => {});'
          new_rotation = '  await safePutKV(env, HOOKTEA_CHECKIN_TEMPLATE_ROTATION_KEY, { offset: (offset + 1) % list.length, pageCount: list.length, updatedAt: new Date().toISOString() }).catch(() => {});'
          if s.count(old_rotation) != 1:
              raise SystemExit(f'checkin template rotation target count={s.count(old_rotation)}')
          s = s.replace(old_rotation, new_rotation, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check worker.js

      - name: Verify intended scope
        shell: bash
        run: |
          git diff --stat main...HEAD || true
          grep -n "HOOKTEA_CHECKIN_TEMPLATE_KEY, data" worker.js
          if grep -q "daily_signin_claims" worker.js; then
            echo "Unexpected daily_signin_claims reference remains in worker.js"
            exit 1
          fi

      - name: Commit and remove temporary runner
        shell: bash
        run: |
          git config user.name "hooktea-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "fix: restore daily signin and repair activity template storage"
          git rm .github/workflows/checkin-activity-recovery.yml
          git commit -m "chore: remove temporary recovery runner"
          git push origin HEAD:fix/checkin-reward-activity-20260821
