name: Webhook precheck fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/webhook-precheck-block-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch webhook precheck only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text(encoding='utf-8')
          old = '''      const hookTeaCheckinTemplateForWebhook = await getHookTeaCheckinTemplate(env).catch(() => null);
      const motherKeywordEvents = events.filter(event => event?.type === "message" && event?.message?.type === "text" && isMotherSiteKeyword(event.message.text) && !isHookTeaDailySigninKeyword(event.message.text) && !isHookTeaCheckinTemplateTrigger(hookTeaCheckinTemplateForWebhook, event.message.text));'''
          new = '''      const motherKeywordCandidates = events.filter(event => event?.type === "message" && event?.message?.type === "text" && isMotherSiteKeyword(event.message.text) && !isHookTeaDailySigninKeyword(event.message.text));
      let motherKeywordEvents = motherKeywordCandidates;
      if (motherKeywordCandidates.length) {
        const hookTeaCheckinTemplateForWebhook = await getHookTeaCheckinTemplate(env).catch(() => null);
        motherKeywordEvents = motherKeywordCandidates.filter(event => !isHookTeaCheckinTemplateTrigger(hookTeaCheckinTemplateForWebhook, event.message.text));
      }'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'target block count={count}; refusing broad edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Syntax and scope checks
        run: |
          node --check worker.js
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "worker.js "
          grep -q 'const motherKeywordCandidates = events.filter' worker.js
          grep -q 'if (motherKeywordCandidates.length)' worker.js
      - name: Commit patch and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'fix: avoid template KV precheck for normal LINE messages'
          git rm .github/workflows/webhook-precheck-fix.yml
          git commit -m 'chore: remove temporary webhook fix runner'
          git push origin HEAD:${{ github.head_ref }}
# trigger synchronize
